[modules.aux.vorbisfile]
name = "vorbisFile.dll"
path = "prepared/vorbisFile.dll"
sha256 = "64263d3ee8098a895505251f8cab852040a235612e88cb0899170287367d6e19"
base = 0x13000000
size = 0x11000
listings = "analysis/vorbisFile.dll"
